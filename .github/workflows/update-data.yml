name: Update data

on:
  workflow_dispatch:
    inputs:
      job:
        description: Which data to update
        type: choice
        options: [all, localities, cbs-index, cbs-tables]
        default: all
      backfill:
        description: Walk every CBS table edition (slow, about 10 minutes)
        type: boolean
        default: false
  schedule:
    # Monthly, after the CBS publishes the CPI (15th) and the housing price index.
    - cron: "17 3 20 * *"

concurrency: update-data

permissions:
  contents: write  # the export step commits web/data/data.json

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Check secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The DATABASE_URL repository secret is not set."
            exit 1
          fi
      - name: Localities and aliases
        if: "!cancelled() && (github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'localities')"
        run: python -m apartment_data.reference.localities --load
      - name: CBS price indices
        if: "!cancelled() && (github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'cbs-index')"
        run: python -m apartment_data.sources.cbs_index --load
      - name: CBS average prices and rents
        if: "!cancelled() && (github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'cbs-tables')"
        run: python -m apartment_data.sources.cbs_tables --load ${{ inputs.backfill && '--backfill' || '' }}
      - name: Export website data
        if: "!cancelled()"
        run: python -m apartment_data.export.web
      - name: Publish website data
        if: "!cancelled()"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/data.json
          if git diff --cached --quiet; then
            echo "Website data unchanged."
            exit 0
          fi
          git commit -m "Update website data"
          git push
